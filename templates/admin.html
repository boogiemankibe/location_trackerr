<!DOCTYPE html>
<html>
<head>
    <title>Admin Tracker Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 500px; width: 100%; border-radius: 8px; margin-bottom: 20px; }
        body { font-family: sans-serif; padding: 20px; background: #f0f2f5; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background: #007bff; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Live Target Map</h2>
        <div id="map"></div>

        <h2>Data Log</h2>
        <table>
            <tr><th>ID</th><th>IP</th><th>City</th><th>Lat/Lon</th><th>Time</th></tr>
            {% for loc in locations %}
            <tr>
                <td>{{ loc.id }}</td>
                <td>{{ loc.ip_address }}</td>
                <td>{{ loc.detected_city }}</td>
                <td>{{ loc.gps_lat }}, {{ loc.gps_lon }}</td>
                <td>{{ loc.created_at }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize the map
        var map = L.map('map').setView([0, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Add markers from our database
        var locations = {{ locations|tojson }};
        locations.forEach(function(loc) {
            if (loc.gps_lat && loc.gps_lon) {
                L.marker([loc.gps_lat, loc.gps_lon])
                 .addTo(map)
                 .bindPopup("<b>Target ID: " + loc.id + "</b><br>IP: " + loc.ip_address + "<br>City: " + loc.detected_city);
            }
        });
    </script>
</body>
</html>
